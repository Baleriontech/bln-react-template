name: 'Build and Push to GCP registry :D'

on:
    push:
      branches:
        - prd
        - uat
        - sit
        - develop

jobs:
    # Notify CI Start
    notify-start:
      name: Notify CI Start
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3

        - name: Slack Notification Start
          uses: Baleriontech/github-action-lib/slack-notify@main
          with:
            slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
            notification-type: 'start'
            workflow-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    build-and-deploy:
      runs-on: 'ubuntu-latest'
      needs: [notify-start]

      environment: ${{(github.ref == 'refs/heads/prod' && 'prod' || github.ref == 'refs/heads/uat' && 'uat' || github.ref == 'refs/heads/sit' && 'sit') || 'dev'}}
      env:
        PROJECT_ID: ${{ vars.PROJECT_ID }}
        REGION: 'asia-southeast1'
        REGISTRY: ${{github.event.repository.name}}
        REGISTRY_FOLDER: "${{github.event.repository.name}}-${{(github.ref == 'refs/heads/prod' && 'prod' || github.ref == 'refs/heads/uat' && 'uat' || github.ref == 'refs/heads/sit' && 'sit') || 'dev'}}"
        WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      permissions:
        contents: 'read'
        id-token: 'write'

      steps:
        - name: 'Checkout'
          uses: 'actions/checkout@v4'

        - id: 'auth'
          name: 'Authenticate to Google Cloud'
          uses: 'google-github-actions/auth@v2'
          with:
            workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
            service_account: ${{ vars.SERVICE_ACCOUNT }}
            project_id: '${{ env.PROJECT_ID }}'
            token_format: 'access_token'

        - name: 'Set Project'
          run: |
            gcloud config set project ${{ env.PROJECT_ID }}

        - name: 'Docker Auth'
          uses: 'docker/login-action@v3'
          with:
            username: 'oauth2accesstoken'
            password: '${{ steps.auth.outputs.access_token }}'
            registry: '${{ env.REGION }}-docker.pkg.dev'

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Create .env file - 1
          run: |
            cat << EOF > .env
            $(jq -r 'to_entries[] | select(.key != "GCP_CREDENTIALS") | "\(.key)=\(.value)"' <<< '${{ toJson(secrets) }}')
            $(jq -r 'to_entries[] | select(.key != "GCP_CREDENTIALS") | "\(.key)=\(.value)"' <<< '${{ toJson(vars) }}')
            EOF

        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            platforms: linux/amd64
            push: true
            context: .
            tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY }}/${{ env.REGISTRY_FOLDER }}:${{ github.sha }}
            build-args: |
              DEV_GITHUB_TOKEN=${{ secrets.DEV_GITHUB_TOKEN }}
              GCP_CREDENTIALS=${{ secrets.GCP_CREDENTIALS_RMOS }}
            secret-files: |
              .env



        - id: 'deploy'
          name: 'Deploy to Cloud Run'
          uses: 'google-github-actions/deploy-cloudrun@v2'
          with:
              service: ${{ env.REGISTRY_FOLDER }}
              image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY }}/${{ env.REGISTRY_FOLDER }}:${{ github.sha }}
              region: ${{ env.REGION }}

        - name: 'Use output'
          run: 'curl "${{ steps.deploy.outputs.url }}"'

    # Notify CI End
    notify-complete:
      name: Notify CI Completion
      runs-on: ubuntu-latest
      #TODO - Add a condition to check if the job is cancelled
      needs: [notify-start, build-and-deploy]
      if: always()  # Run even if previous jobs fail
      steps:
        - uses: actions/checkout@v3

        - name: Get Job Status
          id: job-status
          run: |
            if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
              echo "status=failure" >> $GITHUB_OUTPUT
            elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
              echo "status=cancelled" >> $GITHUB_OUTPUT
            else
              echo "status=success" >> $GITHUB_OUTPUT
            fi

        - name: Slack Notification Complete
          uses: Baleriontech/github-action-lib/slack-notify@main
          with:
            slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
            notification-type: 'complete'
            job-status: ${{ steps.job-status.outputs.status }}
            workflow-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
